name: Deploy Feedback Worker

# Manual only, like the scheduler. The Worker changes rarely, and a deploy on
# every push could rewrite a working credential while someone is mid-review.
on:
  workflow_dispatch:
    inputs:
      push_secrets:
        description: 'Also push the GitHub token and review passphrase to the Worker (first deploy, or rotation)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Verify only — typecheck, test, build and probe the token, but change nothing on Cloudflare'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/feedback

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/feedback/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (no upload)
        run: npx wrangler deploy --dry-run --outdir /tmp/feedback-build

      # Read-only. A token that cannot read the feedback directory cannot write
      # it either, and that failure belongs here rather than on the review page.
      - name: Verify the feedback token reaches super-rss-feed
        env:
          FEEDBACK_GITHUB_TOKEN: ${{ secrets.FEEDBACK_GITHUB_TOKEN }}
          FEEDBACK_REVIEW_KEY: ${{ secrets.FEEDBACK_REVIEW_KEY }}
          PUSH_SECRETS: ${{ inputs.push_secrets }}
        run: |
          set -euo pipefail
          if [ -z "${FEEDBACK_GITHUB_TOKEN:-}" ]; then
            echo "::error::FEEDBACK_GITHUB_TOKEN is not set. See cloudflare/feedback/README.md."
            exit 1
          fi
          if [ "$PUSH_SECRETS" = "true" ] && [ -z "${FEEDBACK_REVIEW_KEY:-}" ]; then
            echo "::error::FEEDBACK_REVIEW_KEY is not set. See cloudflare/feedback/README.md."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $FEEDBACK_GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/zirnhelt/super-rss-feed/contents/feedback")
          if [ "$code" != "200" ]; then
            echo "::error::Token cannot read zirnhelt/super-rss-feed/feedback (HTTP $code). Needs 'Contents: Read and write' on that repo only."
            exit 1
          fi
          echo "  OK    zirnhelt/super-rss-feed/feedback"

      - name: Deploy
        id: deploy
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee /tmp/wrangler-deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/wrangler-deploy.log | head -1 || true)
          if [ -z "$url" ]; then
            echo "::error::Deployed, but wrangler printed no workers.dev URL. If the account has no workers.dev subdomain yet, register one under Workers & Pages in the Cloudflare dashboard and re-run."
            exit 1
          fi
          echo "endpoint=$url/feedback" >> "$GITHUB_OUTPUT"

      # After the deploy, so the secrets land on a Worker that exists. Until they
      # do, the Worker answers 500 "not configured": it fails closed, never open.
      - name: Push secrets to the Worker
        if: inputs.push_secrets && !inputs.dry_run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          FEEDBACK_GITHUB_TOKEN: ${{ secrets.FEEDBACK_GITHUB_TOKEN }}
          FEEDBACK_REVIEW_KEY: ${{ secrets.FEEDBACK_REVIEW_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$FEEDBACK_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN
          printf '%s' "$FEEDBACK_REVIEW_KEY"   | npx wrangler secret put REVIEW_KEY

      # Writes nothing: an empty body with the right passphrase fails validation
      # (400) after the auth check, so a 400 proves both secrets are in place and
      # the passphrase matches. The table reports what the Worker said, not what
      # this step hoped it would say.
      - name: Smoke test and report
        if: ${{ !inputs.dry_run }}
        env:
          ENDPOINT: ${{ steps.deploy.outputs.endpoint }}
          FEEDBACK_REVIEW_KEY: ${{ secrets.FEEDBACK_REVIEW_KEY }}
        run: |
          set -uo pipefail
          origin='https://zirnhelt.github.io'
          preflight=$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS -H "Origin: $origin" "$ENDPOINT")
          no_key=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Origin: $origin" -d '{}' "$ENDPOINT")
          with_key=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Origin: $origin" \
            -H "X-Review-Key: ${FEEDBACK_REVIEW_KEY:-}" -d '{}' "$ENDPOINT")

          verdict() { [ "$1" = "$2" ] && echo ok || echo "**expected $2**"; }
          {
            echo "### Feedback Worker deployed"
            echo
            echo "Endpoint: \`$ENDPOINT\`"
            echo
            echo "| Probe | HTTP | |"
            echo "|---|---|---|"
            echo "| CORS preflight | $preflight | $(verdict "$preflight" 204) |"
            echo "| POST without passphrase | $no_key | $(verdict "$no_key" 401) |"
            echo "| POST with passphrase, empty body | $with_key | $(verdict "$with_key" 400) |"
            echo
            if [ "$no_key" = "500" ]; then
              echo "The Worker says it is not configured: re-run with \`push_secrets: true\`."
            else
              echo "Next: set the **\`FEEDBACK_ENDPOINT\`** repository *variable* in super-rss-feed to the"
              echo "endpoint above, then run its **Deploy Static Files** workflow."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$preflight" != "204" ] || [ "$no_key" != "401" ] || [ "$with_key" != "400" ]; then
            echo "::error::Smoke test failed — see the job summary."
            exit 1
          fi

      - name: Summary (verify only)
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo "### Verify only — nothing was deployed"
            echo
            echo "Types check, tests pass, the bundle builds and the token reaches"
            echo "super-rss-feed. Re-run with \`dry_run: false\` to deploy."
          } >> "$GITHUB_STEP_SUMMARY"
