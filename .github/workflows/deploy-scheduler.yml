name: Deploy Cloudflare Scheduler

# Manual only. The Worker's schedule changes rarely, and a deploy that fires on
# every push to main would be able to remove the crons that start the show.
on:
  workflow_dispatch:
    inputs:
      push_secret:
        description: 'Also push GITHUB_TOKEN to the Worker (first deploy, or PAT rotation)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Verify only — typecheck, build and probe the PAT, but change nothing on Cloudflare'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/scheduler

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/scheduler/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Parses wrangler.jsonc and builds the bundle without touching Cloudflare,
      # so a broken config fails here rather than half-way through a deploy.
      - name: Build (no upload)
        run: npx wrangler deploy --dry-run --outdir /tmp/scheduler-build

      # An expired or under-scoped PAT presents exactly like the outage this
      # Worker exists to prevent: nothing starts at 1 AM and nothing says why.
      # Verify it here, where a failure is a red workflow someone is watching,
      # rather than discovering it from a missing episode. Read-only — it lists
      # each workflow, it does not dispatch anything.
      - name: Verify the scheduler PAT reaches both repos
        env:
          SCHEDULER_GITHUB_TOKEN: ${{ secrets.SCHEDULER_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${SCHEDULER_GITHUB_TOKEN:-}" ]; then
            echo "::error::SCHEDULER_GITHUB_TOKEN is not set. See cloudflare/scheduler/README.md."
            exit 1
          fi

          fail=0
          check() {
            repo="$1"; workflow="$2"
            code=$(curl -sS -o /tmp/probe.json -w '%{http_code}' \
              -H "Authorization: Bearer $SCHEDULER_GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$repo/actions/workflows/$workflow")
            if [ "$code" = "200" ]; then
              echo "  OK    $repo/$workflow"
            else
              echo "::error::PAT cannot read $repo/$workflow (HTTP $code). Needs 'Actions: Read and write' on this repo."
              fail=1
            fi
          }

          echo "Probing the workflows the Worker dispatches:"
          check "zirnhelt/curated-podcast-generator" "daily-podcast.yml"
          check "zirnhelt/super-rss-feed"            "generate-feed.yml"
          exit "$fail"

      # Gated so an ordinary redeploy does not rewrite a working credential.
      - name: Push GITHUB_TOKEN to the Worker
        if: inputs.push_secret && !inputs.dry_run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SCHEDULER_GITHUB_TOKEN: ${{ secrets.SCHEDULER_GITHUB_TOKEN }}
        run: printf '%s' "$SCHEDULER_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN

      - name: Deploy
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # pipefail, because the default shell is `bash -e` and a tee would
          # otherwise mask a failed deploy behind tee's own exit status.
          set -o pipefail
          npx wrangler deploy 2>&1 | tee /tmp/wrangler-deploy.log

      # This step used to print a hardcoded table of the five crons, which said
      # exactly the same thing whether or not any of them registered — a
      # statement of intent wearing the costume of a readback. It now reports
      # what wrangler says it deployed, and checks that against what the Worker
      # can actually route.
      #
      # The check that matters is registered crons vs the SCHEDULE keys in
      # src/index.ts, which is the drift the README warns about and the one
      # that fails silently: a cron with no entry wakes the Worker and
      # dispatches nothing, and an entry with no cron is a ladder rung that
      # never fires. wrangler.jsonc is not re-parsed here — wrangler replaces
      # the deployed crons with that array wholesale, so the log *is* the
      # readback of it.
      - name: Report and verify the deployed triggers
        if: ${{ !inputs.dry_run }}
        env:
          PUSH_SECRET: ${{ inputs.push_secret }}
        run: |
          python3 - <<'PYEOF'
          import os
          import pathlib
          import re
          import sys

          log = pathlib.Path("/tmp/wrangler-deploy.log").read_text()
          registered = re.findall(r"^\s*schedule:\s*(\S.*?)\s*$", log, re.M)

          src = pathlib.Path("src/index.ts").read_text()
          routed = dict(
              re.findall(r"^\s*'([^']+)':\s*\{.*?^\s*label:\s*'([^']*)'", src, re.M | re.S)
          )

          body = []
          failed = False

          if not registered:
              failed = True
              body += [
                  "**No cron triggers were registered.** wrangler printed no",
                  "`schedule:` lines, so either `triggers.crons` is empty in",
                  "wrangler.jsonc or its output format changed and this check needs",
                  "updating. Nothing is starting the nightly runs except the GitHub",
                  "backstop crons.",
                  "",
              ]
          else:
              body += [
                  "Read back from wrangler's own output, cross-checked against the",
                  "`SCHEDULE` table in `src/index.ts`:",
                  "",
                  "| Cron (UTC) | Routes to | |",
                  "|---|---|---|",
              ]
              for cron in registered:
                  if cron in routed:
                      body.append(f"| `{cron}` | {routed[cron]} | ok |")
                  else:
                      failed = True
                      body.append(
                          f"| `{cron}` | **no SCHEDULE entry** | fires into a "
                          "logged config error and dispatches nothing |"
                      )

              for cron in routed:
                  if cron not in registered:
                      failed = True
                      body.append(
                          f"| `{cron}` | {routed[cron]} | **not registered** — this "
                          "rung will never fire |"
                      )
              body.append("")

          # The heading is decided after the checks, not before them — the whole
          # point of this step is that it must not announce a good outcome it
          # has not established.
          heading = (
              "### Scheduler deployed — TRIGGER CHECK FAILED"
              if failed
              else "### Scheduler deployed"
          )
          body.append(f"Secret pushed this run: `{os.environ.get('PUSH_SECRET', '')}`")
          if not failed:
              body += ["", "Watch the Worker's Cron Events table for the next few nights."]

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join([heading, ""] + body) + "\n")

          if failed:
              print(
                  "::error::Deployed cron triggers do not match the SCHEDULE table "
                  "in src/index.ts — see the job summary."
              )
              sys.exit(1)

          print(f"Verified {len(registered)} cron trigger(s) against SCHEDULE.")
          PYEOF

      - name: Summary (verify only)
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo "### Verify only — nothing was deployed"
            echo
            echo "The bundle builds, the config parses, and the PAT reaches both"
            echo "repositories. Re-run with \`dry_run: false\` to deploy."
          } >> "$GITHUB_STEP_SUMMARY"
