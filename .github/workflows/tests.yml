name: Tests

# A test suite only earns its keep if something runs it. Eleven tests sat red
# on main until 2026-07-25 because no workflow invoked pytest.
on:
  push:
    branches: [main]
    # The daily episode commits nothing but content — memory JSON, scripts,
    # transcripts, feeds. Re-running the suite for those is pure waste.
    paths-ignore:
      - 'podcasts/**'
      - '*.xml'
      - '*.mp3'
      - '*.png'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'podcasts/**'
      - '*.xml'
      - '*.mp3'
      - '*.png'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      # tests/conftest.py stubs anthropic, openai, pydub, cohere and azure at
      # import time, so the suite needs no API keys and no TTS packages — the
      # lock file plus pytest is the entire dependency set. ffmpeg isn't
      # needed either: nothing here renders audio.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt pytest

      - name: Run test suite
        run: python -m pytest tests/ -v
