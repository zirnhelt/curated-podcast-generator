name: Ingest Emails

on:
  schedule:
    # Run every 4 hours; deliberately avoids 10:00 UTC when daily-podcast.yml runs
    - cron: '0 0,4,8,14,18,22 * * *'
  workflow_dispatch:  # Allow manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth google-auth-oauthlib google-api-python-client

      - name: Ensure podcasts directory exists
        run: mkdir -p podcasts

      - name: Ingest new emails from Gmail
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_LABEL: ${{ secrets.GMAIL_LABEL }}
        run: python email_ingest.py

      - name: Stamp ingest time
        id: stamp
        run: echo "at=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Commit queue changes
        uses: ./.github/actions/commit-push
        with:
          message: Auto-ingest emails [skip ci] - ${{ steps.stamp.outputs.at }}
          fatal: 'true'
          paths: podcasts/email_queue.json
        continue-on-error: true
