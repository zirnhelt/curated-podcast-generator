name: TTS Eval (no publish)

# Renders sections of the newest committed script through the selected TTS
# providers and uploads the audio as a run artifact. Zero side effects: no
# feed changes, no commits, no R2 uploads — download the artifact and listen.

on:
  workflow_dispatch:
    inputs:
      section:
        description: 'Script section to render'
        required: false
        default: deep_dive
        type: choice
        options:
          - welcome
          - news
          - community_spotlight
          - deep_dive
          - all
      providers:
        description: 'gemini renders Gemini only; all also renders OpenAI + Azure for comparison'
        required: false
        default: gemini
        type: choice
        options:
          - gemini
          - all
      probe_gemini:
        description: 'Diagnose instead of render: ask Gemini the same text with progressively less prompt around it, to find which element it rejects. Produces no audio.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  tts-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Render sections
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL || secrets.GEMINI_TTS_MODEL }}
          GEMINI_TTS_FALLBACK_MODEL: ${{ vars.GEMINI_TTS_FALLBACK_MODEL }}
          OPENAI_API_KEY: ${{ inputs.providers == 'all' && secrets.OPENAI_API_KEY || '' }}
          AZURE_SPEECH_KEY: ${{ inputs.providers == 'all' && secrets.AZURE_SPEECH_KEY || '' }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          TTS_PROVIDERS: ${{ inputs.providers }}
          TTS_SECTION: ${{ inputs.section }}
          TTS_PROBE: ${{ inputs.probe_gemini }}
        run: |
          if [ "$TTS_PROBE" = "true" ]; then
            # Diagnostic run: no audio, so the result is the table itself —
            # put it in the job summary rather than only in the log.
            {
              echo '## Gemini prompt-shape probe'
              echo '```'
              python evaluate_tts.py --section "$TTS_SECTION" --probe-gemini 2>&1 || true
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          SKIP_FLAGS=""
          if [ "$TTS_PROVIDERS" = "gemini" ]; then
            SKIP_FLAGS="--skip-openai --skip-azure"
          fi
          python evaluate_tts.py --section "$TTS_SECTION" $SKIP_FLAGS --output-dir tts-eval

      - name: Upload audio artifact
        if: ${{ !inputs.probe_gemini }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tts-eval-${{ inputs.section }}-${{ inputs.providers }}
          path: tts-eval/
          retention-days: 14
          if-no-files-found: error
