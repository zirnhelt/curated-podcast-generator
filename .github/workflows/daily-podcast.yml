name: Daily Podcast Generation

on:
  schedule:
    # Primary: 1:05 AM Pacific (UTC-7, permanent — BC no longer observes DST)
    # check-episode gates idempotency so duplicate triggers are safe.
    - cron: '5 8 * * *'
    # Fallback 1: 2:05 AM Pacific
    - cron: '5 9 * * *'
    # Fallback 2: 3:05 AM Pacific — still 3+ hrs before 6:30 AM wakeup
    - cron: '5 10 * * *'
  workflow_dispatch:
    inputs:
      tts_provider:
        description: 'TTS provider — gemini (default) uses Gemini multi-speaker with OpenAI fallback; openai uses OpenAI primary + Azure parallel; azure uses Azure only (no parallel)'
        required: false
        default: gemini
        type: choice
        options:
          - openai
          - azure
          - gemini
      force:
        description: 'Force regeneration even if today''s episode already exists'
        required: false
        default: false
        type: boolean

concurrency:
  group: daily-podcast
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  check-episode:
    runs-on: ubuntu-latest
    outputs:
      episode_exists: ${{ steps.check.outputs.episode_exists }}
    steps:
      - name: Identify trigger
        run: |
          case "${{ github.event.schedule }}" in
            '5 8 * * *') label="Primary (1:05 AM Pacific)" ;;
            '5 9 * * *') label="Fallback 1 (2:05 AM Pacific)" ;;
            '5 10 * * *') label="Fallback 2 (3:05 AM Pacific)" ;;
            '')           label="Manual (workflow_dispatch)" ;;
            *)            label="Unknown: ${{ github.event.schedule }}" ;;
          esac
          echo "Trigger: $label"

      - name: Check if today's episode already exists
        id: check
        run: |
          TODAY=$(TZ='America/Vancouver' date '+%Y-%m-%d')
          echo "Checking for episode dated $TODAY in live RSS feed..."
          FEED=$(curl -sf --max-time 10 \
            "https://zirnhelt.github.io/curated-podcast-generator/podcast-feed.xml" || echo "")
          if echo "$FEED" | grep -q "$TODAY"; then
            echo "episode_exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ Episode for $TODAY already exists — skipping generation"
          else
            echo "episode_exists=false" >> "$GITHUB_OUTPUT"
            echo "🆕 No episode for $TODAY found — proceeding with generation"
          fi

  generate-podcast:
    runs-on: ubuntu-latest
    needs: check-episode
    if: |
      needs.check-episode.outputs.episode_exists != 'true' ||
      inputs.force == true ||
      inputs.tts_provider == 'azure'

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # The commit steps below are composite-action calls, so they cannot run
      # $(TZ=... date) inline. Stamp the episode date once here instead — which
      # also keeps every commit in the run naming the same day even if the job
      # crosses midnight Pacific.
      - name: Stamp episode date
        id: stamp
        run: echo "date=$(TZ='America/Vancouver' date '+%Y-%m-%d %A')" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Download existing files from GitHub Pages
        run: |
          # Download existing episodes and memory files if they exist
          echo "Downloading existing files from GitHub Pages..."

          # Ensure podcasts directory exists
          mkdir -p podcasts

          # Memory/state files and feeds are committed to git, so the checkout is
          # the source of truth — Pages lags git by minutes after a push, and a
          # queued fallback run once overwrote fresh memory with stale Pages
          # copies (2026-07-03), rolling back the day's episode memory.
          # Only fetch from Pages as a fallback when a file is missing entirely.
          for f in episode_memory.json host_personality_memory.json debate_memory.json psa_rotation_state.json twit_inspiration.json; do
            if [ ! -f "podcasts/$f" ]; then
              wget "https://zirnhelt.github.io/curated-podcast-generator/podcasts/$f" -O "podcasts/$f" || { rm -f "podcasts/$f"; echo "No $f found"; }
            fi
          done
          [ -f podcast-feed.xml ] || wget https://zirnhelt.github.io/curated-podcast-generator/podcast-feed.xml -O podcast-feed.xml || { rm -f podcast-feed.xml; echo "No existing RSS feed"; }
          [ -f tts-test-feed.xml ] || wget https://zirnhelt.github.io/curated-podcast-generator/tts-test-feed.xml -O tts-test-feed.xml || { rm -f tts-test-feed.xml; echo "No existing TTS test feed"; }

          # Download recent audio so _recover_orphaned_episodes() (3-day lookback) finds
          # audio for recent episodes and doesn't try to regenerate them.
          # Audio is no longer committed to git — fetch last 5 episodes from Pages instead.
          if [ -f podcast-feed.xml ]; then
            grep -oP '(?<=url=")[^"]+\.mp3(?=")' podcast-feed.xml | head -5 | while read url; do
              fname=$(basename "$url")
              wget -q "$url" -O "podcasts/$fname" && echo "  Downloaded $fname" || echo "  Skipped $fname"
            done
          fi

          echo "Download complete"
        continue-on-error: true

      # Generation runs in two stages so the expensive half is durable before
      # the fragile half starts. Script generation is where the API spend lives
      # (Sonnet script + polish + fact-check + cold open); audio generation is
      # where the runner dies (see the OOM note on the video step below). With
      # a commit between them, a failed render no longer discards the script,
      # citations, and memory updates that were already paid for.
      - name: Generate episode script
        id: generate
        timeout-minutes: 35
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          # The TTS provider flags (not the keys) must be set on this stage too:
          # the polish prompt is provider-gated — only Gemini performs `(cue)`
          # stage directions, so _stage_direction_addendum() would omit them and
          # the credit written into citations would name the wrong provider.
          USE_AZURE_TTS: ${{ inputs.tts_provider == 'azure' && 'true' || '' }}
          USE_GEMINI_TTS: ${{ (inputs.tts_provider == 'gemini' || inputs.tts_provider == '') && 'true' || '' }}
        run: |
          case "${{ github.event.schedule }}" in
            '5 8 * * *') label="Primary (1:05 AM Pacific)" ;;
            '5 9 * * *') label="Fallback 1 (2:05 AM Pacific)" ;;
            '5 10 * * *') label="Fallback 2 (3:05 AM Pacific)" ;;
            '')           label="Manual (workflow_dispatch)" ;;
            *)            label="Unknown: ${{ github.event.schedule }}" ;;
          esac
          echo "Starting daily podcast script generation..."
          echo "Trigger: $label"
          echo "Current UTC time: $(date -u)"
          echo "Current Pacific time: $(TZ='America/Vancouver' date)"

          # Re-check idempotency against the committed feed. The check-episode
          # job reads the live Pages feed, which lags git — a queued fallback
          # run can pass that check minutes after the primary run pushed, then
          # regenerate audio and clobber state (happened 2026-07-03).
          #
          # Read origin/main, not the checkout. actions/checkout uses the run's
          # trigger-time SHA, so a run queued behind the concurrency group sees
          # the repo as it was *before* the earlier run shipped the episode —
          # which is how 2026-07-26 rendered the same episode three times.
          TODAY=$(TZ='America/Vancouver' date '+%Y-%m-%d')
          git fetch --depth=1 origin main || echo "::warning::Could not fetch origin/main — idempotency check falls back to the checked-out feed"
          FEED_AT_HEAD=$(git show origin/main:podcast-feed.xml 2>/dev/null || cat podcast-feed.xml)
          if [ "${{ github.event_name }}" = "schedule" ] && echo "$FEED_AT_HEAD" | grep -q "$TODAY"; then
            echo "✅ Episode for $TODAY already committed to git — skipping duplicate generation."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          python podcast_generator.py --stage script
          rc=$?
          set -e

          # Exit 75 = Anthropic spend cap reached. The account stays blocked
          # until a stated date, so the 2:05 and 3:05 fallback crons would
          # repeat the same curation spend and fail identically (2026-07-25).
          # Skip the day as a warning rather than a red run.
          if [ "$rc" -eq 75 ]; then
            echo "::warning::Anthropic usage limit reached — no episode generated today."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Exit 76 = the upstream super-rss-feed gave us nothing usable. The
          # code raises it distinctly so CI can tell it from a crash, but nothing
          # here consumed it, so an empty feed went red exactly like a bug.
          # Same shape as 75: the fallback crons will hit the same empty feed.
          if [ "$rc" -eq 76 ]; then
            echo "::warning::Upstream feed had no usable articles — no episode generated today."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$rc" -eq 0 ] || exit "$rc"

          echo "generated=true" >> "$GITHUB_OUTPUT"

          echo "Script generation complete!"

      # The whole point of the stage split: get the Claude spend onto main
      # before TTS runs, so an audio failure costs only the render.
      #
      # Other workflows (periodic review, email ingest) push to main while this
      # one runs, so a plain push can be rejected non-fast-forward. The action
      # rebases (with --autostash) and retries; only a push that never lands
      # after three attempts warns. See the 2026-07-26 triple render.
      - name: Commit script, citations and memory
        if: steps.generate.outputs.generated == 'true'
        uses: ./.github/actions/commit-push
        with:
          message: Episode script - ${{ steps.stamp.outputs.date }}
          # article_holding.json is the super-cycle holding pen — written by
          # route_articles_for_focus and previously never committed, so held
          # articles were silently lost between runs.
          paths: |
            podcasts/podcast_script_*.txt
            podcasts/citations_*.json
            podcasts/episode_memory.json
            podcasts/host_personality_memory.json
            podcasts/debate_memory.json
            podcasts/psa_rotation_state.json
            podcasts/article_holding.json
            podcasts/twit_inspiration.json
            podcasts/content_seeds.json
            podcasts/email_queue.json

      # The audio half is three steps, not one. They fail for different reasons
      # — back-catalogue TTS, today's TTS, and publishing surfaces (R2
      # credentials, disk, network) — and used to share a single failure
      # boundary, so a broken R2 sync cost a full 40-minute re-render to retry.
      # Each stage writes its per-segment table to the job summary.
      - name: Recover orphaned episodes
        if: steps.generate.outputs.generated == 'true'
        timeout-minutes: 15
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          USE_AZURE_TTS: ${{ inputs.tts_provider == 'azure' && 'true' || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL || secrets.GEMINI_TTS_MODEL }}
          USE_GEMINI_TTS: ${{ (inputs.tts_provider == 'gemini' || inputs.tts_provider == '') && 'true' || '' }}
        run: |
          echo "Re-rendering any past episodes whose audio never landed..."
          python podcast_generator.py --stage recover

      - name: Render episode audio
        id: render
        if: steps.generate.outputs.generated == 'true'
        timeout-minutes: 40
        env:
          # Claude is still reachable from the audio path for provider-fallback
          # bookkeeping, so the key stays.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          USE_AZURE_TTS: ${{ inputs.tts_provider == 'azure' && 'true' || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL || secrets.GEMINI_TTS_MODEL }}
          USE_GEMINI_TTS: ${{ (inputs.tts_provider == 'gemini' || inputs.tts_provider == '') && 'true' || '' }}
        run: |
          echo "Starting daily podcast audio render..."
          # Exit 77 = no audio produced. Deliberately not continue-on-error:
          # this previously exited 0 and the run went green on a broken episode.
          python podcast_generator.py --stage render

          echo "Audio render complete!"

      # Bank the render before publishing. The sidecars are the video
      # renderer's input and are cheap to lose but expensive to recreate.
      #
      # citations_*.json belongs here too: refresh_citations_tts_credit() rewrites
      # it after rendering to name the provider that actually spoke. It was left
      # unstaged, so the rebase below hit "cannot pull with rebase: You have
      # unstaged changes" and `|| true` sent the push out un-rebased (2026-08-02).
      # The recover stage does the same to back-catalogue episodes, hence the glob.
      - name: Commit audio sidecars
        if: always() && steps.generate.outputs.generated == 'true'
        uses: ./.github/actions/commit-push
        with:
          message: Episode audio sidecars - ${{ steps.stamp.outputs.date }}
          # Audio itself is deployed via Pages/R2, never committed.
          paths: |
            podcasts/podcast_chapters_*.json
            podcasts/video_timeline_*.json
            podcasts/citations_*.json

      # Gated on the render having actually succeeded. `if: always()` here used
      # to run this after an exit-77 render — one that produced *no audio at
      # all* — and the R2 sync would advance the live feed's origin while the
      # steps that record the episode (memory commit, Pages deploy) were skipped
      # for the same failure. Both of the next run's idempotency gates then read
      # "no episode today" and re-rendered it. A degraded render still publishes;
      # an absent one must leave nothing behind to publish.
      - name: Publish episode
        if: steps.render.outcome == 'success' && steps.generate.outputs.generated == 'true'
        timeout-minutes: 15
        continue-on-error: true
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: cariboo-signals
        run: |
          echo "Writing transcript, feeds and site, then syncing to R2..."
          # Exit 78 = one or more publish surfaces degraded. Surfaced as a
          # warning rather than a red run: the episode audio is safe, and the
          # per-segment table in the job summary names what failed.
          set +e
          python podcast_generator.py --stage publish
          rc=$?
          set -e
          if [ "$rc" -eq 78 ]; then
            echo "::warning::One or more publish steps degraded — see the segment table in the job summary."
            exit 0
          fi
          [ "$rc" -eq 0 ] || exit "$rc"

      - name: List generated files
        run: |
          echo "Files in directory:"
          ls -la

          echo "Episode files in podcasts/:"
          ls -la podcasts/podcast_audio_* podcasts/podcast_script_* podcasts/citations_* || echo "No episode files found"

          echo "Memory files:"
          ls -la podcasts/episode_memory.json podcasts/host_personality_memory.json podcasts/debate_memory.json || echo "No memory files found"

      # This push carries podcast-feed.xml — the record that today's episode
      # shipped, and the input to the next run's idempotency gate. On 2026-07-26
      # it was rejected non-fast-forward (a review workflow had pushed
      # mid-render), continue-on-error hid it, and the next queued cron
      # re-rendered the whole episode. Rebase, retry, and be loud.
      - name: Commit memory and cache files
        uses: ./.github/actions/commit-push
        with:
          message: Daily podcast generation - ${{ steps.stamp.outputs.date }}
          # index.html is regenerated by _regenerate_index_html() on every
          # publish and was staged by nothing — so it sat permanently dirty
          # (last committed 2026-07-22), which is what made the rebase here fail
          # on every single run. Audio is excluded; it ships via Pages/R2 only.
          paths: |
            podcasts/episode_memory.json
            podcasts/host_personality_memory.json
            podcasts/debate_memory.json
            podcasts/psa_rotation_state.json
            podcasts/twit_inspiration.json
            podcasts/content_seeds.json
            podcasts/email_queue.json
            podcasts/podcast_script_*.txt
            podcasts/citations_*.json
            podcasts/podcast_transcript_*.html
            podcasts/podcast_transcript_*.vtt
            podcast-feed.xml
            tts-test-feed.xml
            index.html

      - name: Copy files to output directory
        run: |
          echo "Preparing files for GitHub Pages deployment..."
          mkdir -p output/podcasts

          # Copy only recent episode files (last 2 days) — historical files are
          # already on gh-pages via keep_files: true, no need to re-deploy them.
          TODAY=$(TZ='America/Vancouver' date '+%Y-%m-%d')
          YESTERDAY=$(TZ='America/Vancouver' date -d 'yesterday' '+%Y-%m-%d')
          for f in podcasts/podcast_audio_*.mp3; do
            [[  "$f" == *"$TODAY"* || "$f" == *"$YESTERDAY"* ]] && cp "$f" output/podcasts/ && echo "  copied $f"
          done
          for f in podcasts/podcast_script_*.txt; do
            [[ "$f" == *"$TODAY"* || "$f" == *"$YESTERDAY"* ]] && cp "$f" output/podcasts/ && echo "  copied $f"
          done
          for f in podcasts/citations_*.json; do
            [[ "$f" == *"$TODAY"* || "$f" == *"$YESTERDAY"* ]] && cp "$f" output/podcasts/ && echo "  copied $f"
          done
          for f in podcasts/podcast_transcript_*.html; do
            [[ "$f" == *"$TODAY"* || "$f" == *"$YESTERDAY"* ]] && cp "$f" output/podcasts/ && echo "  copied $f"
          done
          for f in podcasts/podcast_transcript_*.vtt; do
            [[ "$f" == *"$TODAY"* || "$f" == *"$YESTERDAY"* ]] && cp "$f" output/podcasts/ && echo "  copied $f"
          done

          # Copy memory files into output/podcasts/
          cp podcasts/episode_memory.json podcasts/host_personality_memory.json podcasts/debate_memory.json output/podcasts/ 2>/dev/null || echo "No memory files to copy"
          cp podcasts/psa_rotation_state.json output/podcasts/ 2>/dev/null || echo "No PSA rotation state to copy"
          cp podcasts/twit_inspiration.json output/podcasts/ 2>/dev/null || echo "No TWIT inspiration cache to copy"
          # NOTE: email_queue.json is intentionally NOT deployed — it contains
          # email sender addresses (PII) and partial message bodies.

          # Copy website files and all cover images referenced by index.html
          cp index.html output/
          cp podcast-feed.xml output/
          cp tts-test-feed.xml output/ 2>/dev/null || echo "No TTS test feed to copy"
          cp cariboo-signals.png output/
          cp cariboo-saturday.png output/ 2>/dev/null || true
          cp cariboo-sunday.png output/ 2>/dev/null || true
          cp Deepdives.png output/ 2>/dev/null || true

          echo "Files ready for deployment:"
          ls -la output/
          ls -la output/podcasts/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          keep_files: true
          commit_message: 'Daily podcast deployment - ${{ github.run_id }}'

      # Video is strictly additive and runs LAST, only after the episode has
      # been committed and deployed to Pages, and only when this run actually
      # generated a new episode (fallback cron runs that skipped generation
      # don't re-render). The 2026-07-15/16 runs showed why: the ffmpeg render
      # had unbounded memory growth (fixed in build_ffmpeg_command — see the
      # format-before-fps comment) that OOM-killed the runner VM (SIGTERM,
      # exit 143), and because the video step then sat before commit/deploy,
      # the runner death cancelled every remaining step — the generated
      # episode never shipped. continue-on-error still covers ordinary
      # failures; the ordering covers runner death.
      # Without the YT_* secrets the script runs render-only and leaves the
      # MP4 in podcasts/ for the review-artifact step below. Once the secrets
      # are added, the MP4 is uploaded to YouTube and removed.
      - name: Render video and upload to YouTube
        if: steps.generate.outputs.generated == 'true'
        timeout-minutes: 25
        continue-on-error: true
        env:
          # Flush progress prints immediately — the OOM kills above produced
          # zero log output because Python block-buffers stdout in CI.
          PYTHONUNBUFFERED: '1'
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: unlisted
        run: python video_generator.py

      # The upload ledger (idempotency record) is written by the video step,
      # which now runs after the main state commit — so it gets its own commit.
      - name: Commit YouTube upload ledger
        if: steps.generate.outputs.generated == 'true'
        uses: ./.github/actions/commit-push
        with:
          message: Record YouTube upload - ${{ steps.stamp.outputs.date }}
          paths: podcasts/youtube_uploads.json

      # No-op when the video was uploaded to YouTube (the MP4 is deleted after
      # upload); in render-only/test mode this is how you review the video.
      - name: Upload video for review (render-only mode)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: episode-video
          path: podcasts/podcast_video_*.mp4
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload artifacts (for debugging)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: daily-podcast-files
          path: |
            podcasts/podcast_audio_*.mp3
            podcasts/podcast_script_*.txt
            podcasts/citations_*.json
            podcasts/video_timeline_*.json
            podcasts/youtube_uploads.json
            podcasts/episode_memory.json
            podcasts/host_personality_memory.json
            podcasts/debate_memory.json
            podcasts/tts_comparison_log.json
          retention-days: 7
        if: always()
