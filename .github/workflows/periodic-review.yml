name: Periodic Script Review

on:
  schedule:
    # Every Sunday at 2:00 AM Pacific (09:00 UTC summer / 10:00 UTC winter)
    - cron: '0 9 * * 0'
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days of scripts to review'
        required: false
        default: '7'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # review_scripts.py reads the week from `git log --since`. The default
          # depth-1 checkout has no week to read, so every review since launch
          # shipped as a header and nothing else — silently, because an empty
          # log and a quiet week are the same answer.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-lock.txt

      - name: Determine days to review
        id: params
        env:
          INPUT_DAYS: ${{ github.event.inputs.days }}
        run: |
          DAYS="${INPUT_DAYS:-7}"
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"
          echo "Reviewing last $DAYS days of scripts"

      - name: Run script review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAYS_TO_REVIEW: ${{ steps.params.outputs.days }}
        run: |
          python review_scripts.py --days "$DAYS_TO_REVIEW" --output file

      - name: Read report for issue body
        id: report
        run: |
          REPORT_FILE=$(ls reviews/review_*.md | sort | tail -1)
          echo "path=$REPORT_FILE" >> "$GITHUB_OUTPUT"
          # Truncate to ~65000 chars so it fits in a GitHub issue body
          python3 -c "
          with open('$REPORT_FILE') as f:
              content = f.read()
          limit = 65000
          if len(content) > limit:
              content = content[:limit] + '\n\n*(report truncated — see committed file for full version)*'
          print(content, end='')
          " > /tmp/issue_body.md

      - name: Create GitHub Issue with report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REVIEW_DATE=$(TZ='America/Vancouver' date '+%Y-%m-%d')
          gh issue create \
            --title "Script Review — $REVIEW_DATE" \
            --body-file /tmp/issue_body.md \
            --label "script-review"

      - name: Stamp review date
        id: stamp
        run: echo "date=$(TZ='America/Vancouver' date '+%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      # Pushed with no rebase at all until now. This workflow runs while the
      # daily podcast job is mid-render, so it is one of the pushes that made
      # the daily run's own push get rejected non-fast-forward (2026-07-26).
      - name: Commit review report
        uses: ./.github/actions/commit-push
        with:
          message: Add script review ${{ steps.stamp.outputs.date }}
          fatal: 'true'
          paths: reviews/

  # The week's correction and feedback emails -> proposed standing notes, as a
  # PR the producer merges or closes. Never auto-merged: email text is
  # untrusted, and config/standing_notes.txt reaches every script prompt. One
  # proposal PR at a time, so a second run cannot replace a pending one.
  # GITHUB_TOKEN can open a PR only while Settings -> Actions -> General ->
  # "Allow GitHub Actions to create and approve pull requests" is on.
  standing-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Skip while a proposal PR is open
        id: pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open=$(gh pr list --head standing-notes --state open --json number --jq 'length')
          echo "open=${open}" >> "$GITHUB_OUTPUT"
          if [ "${open}" != "0" ]; then echo "::notice::A standing-notes PR is still open; merge or close it first."; fi

      - name: Set up Python
        if: steps.pending.outputs.open == '0'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.pending.outputs.open == '0'
        run: pip install -r requirements-lock.txt

      - name: Propose standing notes
        id: propose
        if: steps.pending.outputs.open == '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python standing_notes.py
          if [ -f standing_notes_pr.md ]; then echo "proposed=1" >> "$GITHUB_OUTPUT"; fi

      - name: Record the emails considered
        if: steps.pending.outputs.open == '0'
        uses: ./.github/actions/commit-push
        with:
          message: Record standing-notes proposals
          paths: podcasts/standing_notes_ledger.json

      - name: Open the proposal PR
        if: steps.propose.outputs.proposed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c standing-notes
          git add config/standing_notes.txt
          git commit -m "Propose standing notes from this week's email"
          git push --force origin standing-notes
          gh pr create --base main --head standing-notes \
            --title "Standing notes: new proposals from this week's email" \
            --body-file standing_notes_pr.md
